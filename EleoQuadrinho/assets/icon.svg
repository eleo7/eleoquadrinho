<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5b301"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b301" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0c11"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#131722" stroke="url(#grad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  
  <!-- Livro / HQ estilizado -->
  <g filter="url(#shadow)" transform="translate(256, 260)">
    <!-- Asa esquerda do livro -->
    <path d="M-140 -90 C-90 -110, -30 -100, 0 -80 L0 100 C-30 80, -90 70, -140 90 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M-135 -85 C-90 -103, -30 -93, 0 -76 L0 94 C-30 76, -90 66, -135 84 Z" fill="#f8fafc"/>
    <path d="M-125 -60 L-20 -48 M-125 -30 L-20 -18 M-125 0 L-20 12 M-125 30 L-30 40" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Asa direita do livro -->
    <path d="M140 -90 C90 -110, 30 -100, 0 -80 L0 100 C30 80, 90 70, 140 90 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M135 -85 C90 -103, 30 -93, 0 -76 L0 94 C30 76, 90 66, 135 84 Z" fill="#f8fafc"/>
    <path d="M125 -60 L20 -48 M125 -30 L20 -18 M125 0 L20 12 M125 30 L30 40" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Lombada -->
    <path d="M-6 -80 L6 -80 L6 102 L-6 102 Z" fill="#f5b301"/>
    
    <!-- Letras EQ em estilo Comic / Bangers -->
    <text x="0" y="24" font-family="'Bangers', 'Impact', sans-serif" font-size="116" font-weight="900" fill="#111" text-anchor="middle" letter-spacing="4">EQ</text>
    <text x="-3" y="21" font-family="'Bangers', 'Impact', sans-serif" font-size="116" font-weight="900" fill="url(#grad)" text-anchor="middle" letter-spacing="4">EQ</text>
  </g>
</svg>
